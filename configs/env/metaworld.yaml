task: 'metaworld_reach'
steps: 1.01e6
env_num: 16
eval_episode_num: 10
action_repeat: 2
train_ratio: 512
time_limit: 500

seed: ${seed}
device: ${device}

size: [64, 64]
encoder:
  mlp_keys: '$^'
  cnn_keys: 'image'
decoder:
  mlp_keys: '$^'
  cnn_keys: 'image'

camera: corner2

# Object/goal layouts: random (fresh every episode) | train (50 fixed) | test (50 held-out).
configs: random
eval_configs: random
config_seed: 0
